server {
    listen 80;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths (e.g. /events/3 on reload) serve index.html and React Router takes over.
    location / {
        try_files $uri /index.html;
    }

    # Hashed asset filenames change when content changes, so they can be cached "forever".
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
