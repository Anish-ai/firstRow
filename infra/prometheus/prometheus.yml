# Prometheus pulls ("scrapes") metrics from the backend every 5 seconds
# and evaluates the alert rules in alerts.yml.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: firstrow-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
