# Unit tests for the alert rules, run with:
#   promtool test rules alerts.test.yml
# Each test feeds made-up metric series (one sample per minute) and states which alerts must fire when.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # 10% of requests fail with 500 -> HighServerErrorRate fires once that has lasted 2 minutes.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="firstrow", uri="/api/v1/events", status="200"}'
        values: '0+540x15'
      - series: 'http_server_requests_seconds_count{application="firstrow", uri="/api/v1/events", status="500"}'
        values: '0+60x15'
    alert_rule_test:
      - eval_time: 2m
        alertname: HighServerErrorRate
        exp_alerts: []          # condition true since 1m, but not yet for the required 2 minutes (fires at 3m)
      - eval_time: 10m
        alertname: HighServerErrorRate
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "More than 5% of API requests are failing (5xx)"
              description: "10% of requests returned 5xx over the last 5 minutes."

  # 1% errors stays below the 5% threshold -> no alert.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="firstrow", uri="/api/v1/events", status="200"}'
        values: '0+990x15'
      - series: 'http_server_requests_seconds_count{application="firstrow", uri="/api/v1/events", status="500"}'
        values: '0+10x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: HighServerErrorRate
        exp_alerts: []

  # 90% of hold attempts conflict at 5 conflicts/second -> HoldConflictSpike fires after 1 minute.
  - interval: 1m
    input_series:
      - series: 'holds_conflicts_total{application="firstrow"}'
        values: '0+300x15'
      - series: 'holds_granted_total{application="firstrow"}'
        values: '0+33x15'
    alert_rule_test:
      - eval_time: 6m
        alertname: HoldConflictSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Over 80% of seat hold attempts are conflicting"
              description: "90.09% of hold attempts got 409 in the last 2 minutes."

  # The measured load-test ratio (~58%) must NOT page anyone.
  - interval: 1m
    input_series:
      - series: 'holds_conflicts_total{application="firstrow"}'
        values: '0+300x15'
      - series: 'holds_granted_total{application="firstrow"}'
        values: '0+215x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: HoldConflictSpike
        exp_alerts: []
