name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven   # caches ~/.m2 keyed on pom.xml

      # ubuntu-latest runners have Docker, so the Testcontainers tests run against real Postgres.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm   # caches ~/.npm keyed on package-lock.json
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  infra:
    name: Infra config (compose, Prometheus rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose file
        run: docker compose -f infra/docker-compose.yml --profile observability config --quiet
      - name: Check Prometheus config and unit-test the alert rules
        run: |
          docker run --rm --entrypoint promtool -w /etc/prometheus             -v "$PWD/infra/prometheus:/etc/prometheus:ro" prom/prometheus:v3.15.1 check config prometheus.yml
          docker run --rm --entrypoint promtool -w /etc/prometheus             -v "$PWD/infra/prometheus:/etc/prometheus:ro" prom/prometheus:v3.15.1 test rules alerts.test.yml

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: firstrow-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
